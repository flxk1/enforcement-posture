name: release

# Publishes to PyPI on a version tag, using PyPI Trusted Publishing (OIDC).
# There is no API token anywhere — not in secrets, not on a laptop. PyPI verifies
# the workflow's identity directly. One-time setup on PyPI is required before the
# first run; see the repository README.

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[test]"
      - run: pytest -q
      - run: python -m unittest discover -s tests
      - run: python conformance/check_vectors.py

  publish:
    # Nothing is published unless the suite and the conformance vectors are green.
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
